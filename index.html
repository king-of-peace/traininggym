<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusTrade | Professional Trading Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Animations */
        @keyframes pulse-green {
            0%, 100% { color: #10b981; }
            50% { color: #34d399; }
        }
        @keyframes pulse-red {
            0%, 100% { color: #ef4444; }
            50% { color: #f87171; }  /* ✅ FIXED: Removed invalid nested braces */
        }
        .animate-price-up { animation: pulse-green 1s ease-in-out; }
        .animate-price-down { animation: pulse-red 1s ease-in-out; }

        /* Glassmorphism */
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Trading View Grid */
        .trading-grid {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            grid-template-rows: 60px 1fr 250px;
            height: 100vh;
            gap: 1px;
            background: #0f172a;
        }

        .order-book-row:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        /* Ticker Animation */
        .ticker-wrap {
            overflow: hidden;
            white-space: nowrap;
        }
        .ticker {
            display: inline-block;
            animation: ticker 30s linear infinite;
        }
        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Loading Skeleton */
        .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 overflow-hidden">

    <!-- SPA Container -->
    <div id="app"></div>

    <script>
        // ==================== STATE MANAGEMENT ====================
        const store = {
            user: JSON.parse(localStorage.getItem('user')) || null,
            balance: parseFloat(localStorage.getItem('balance')) || 10000.00,
            positions: JSON.parse(localStorage.getItem('positions')) || [],
            orders: JSON.parse(localStorage.getItem('orders')) || [],
            watchlist: JSON.parse(localStorage.getItem('watchlist')) || ['BTC-USD', 'ETH-USD', 'AAPL', 'TSLA'],
            currentSymbol: 'BTC-USD',
            prices: {},
            chartInstance: null,
            
            // Mock price data generator
            generatePrice(symbol) {
                const basePrices = {
                    'BTC-USD': 67234.56,
                    'ETH-USD': 3456.78,
                    'AAPL': 178.35,
                    'TSLA': 245.67,
                    'GOOGL': 142.56,
                    'MSFT': 378.91,
                    'AMZN': 145.23,
                    'NVDA': 892.45
                };
                
                if (!this.prices[symbol]) {
                    this.prices[symbol] = basePrices[symbol] || 100 + Math.random() * 100;
                }
                
                // Random walk
                const change = (Math.random() - 0.5) * (this.prices[symbol] * 0.002);
                this.prices[symbol] += change;
                return {
                    price: this.prices[symbol],
                    change: change,
                    changePercent: (change / this.prices[symbol]) * 100
                };
            },

            save() {
                localStorage.setItem('user', JSON.stringify(this.user));
                localStorage.setItem('balance', this.balance);
                localStorage.setItem('positions', JSON.stringify(this.positions));
                localStorage.setItem('orders', JSON.stringify(this.orders));
                localStorage.setItem('watchlist', JSON.stringify(this.watchlist));
            },

            login(email, password) {
                // Mock authentication
                this.user = {
                    id: Date.now(),
                    email: email,
                    name: email.split('@')[0],
                    tier: 'Pro',
                    verified: true
                };
                this.save();
                return true;
            },

            logout() {
                this.user = null;
                this.save();
                router.navigate('login');
            },

            placeOrder(symbol, side, type, quantity, price = null) {
                const order = {
                    id: Date.now(),
                    symbol,
                    side,
                    type,
                    quantity: parseFloat(quantity),
                    price: price || this.prices[symbol]?.price,
                    status: 'filled',
                    timestamp: new Date().toISOString(),
                    total: (price || this.prices[symbol]?.price) * parseFloat(quantity)
                };

                // Update balance and positions (simplified)
                if (side === 'buy') {
                    this.balance -= order.total;
                    const existing = this.positions.find(p => p.symbol === symbol);
                    if (existing) {
                        existing.quantity += order.quantity;
                        existing.avgPrice = (existing.avgPrice * existing.quantity + order.total) / (existing.quantity + order.quantity);
                    } else {
                        this.positions.push({
                            symbol,
                            quantity: order.quantity,
                            avgPrice: order.price,
                            opened: new Date().toISOString()
                        });
                    }
                } else {
                    this.balance += order.total;
                    const existing = this.positions.find(p => p.symbol === symbol);
                    if (existing) {
                        existing.quantity -= order.quantity;
                        if (existing.quantity <= 0) {
                            this.positions = this.positions.filter(p => p.symbol !== symbol);
                        }
                    }
                }

                this.orders.unshift(order);
                this.save();
                return order;
            }
        };

        // ==================== ROUTER ====================
        const router = {
            currentRoute: 'landing',
            
            routes: {
                landing: renderLanding,
                login: renderLogin,
                register: renderRegister,
                dashboard: renderDashboard,
                trading: renderTrading,
                portfolio: renderPortfolio,
                funding: renderFunding,
                settings: renderSettings

            navigate(route) {
                this.currentRoute = route;
                const app = document.getElementById('app');
                app.innerHTML = '';
                app.className = 'min-h-screen bg-slate-950';
                
                if (this.routes[route]) {
                    this.routes[route](app);
                }

                // Initialize route-specific logic
                if (route === 'trading') initTrading();
                if (route === 'dashboard') initDashboard();
                if (route === 'portfolio') initPortfolio();
            }
        };

                                    </button>

        function Ticker() {
            const symbols = ['BTC-USD', 'ETH-USD', 'AAPL', 'TSLA', 'GOOGL', 'MSFT', 'AMZN', 'NVDA', 'META', 'NFLX'];
            const items = symbols.map(sym => {
                const data = store.generatePrice(sym);
                const color = data.change >= 0 ? 'text-emerald-400' : 'text-red-400';
                const arrow = data.change >= 0 ? '↑' : '↓';
                return `
                    <span class="inline-flex items-center gap-2 mx-4">
                        <span class="font-semibold text-slate-300">${sym}</span>
                        <span class="mono ${color}">${data.price.toFixed(2)} ${arrow} ${Math.abs(data.changePercent).toFixed(2)}%</span>
                    </span>
                `;
            }).join('');
            
            return `
                <div class="bg-slate-900 border-b border-slate-800 h-10 flex items-center overflow-hidden">
                    <div class="ticker-wrap">
                        <div class="ticker text-sm">
                            ${items}${items}
                        </div>
                    </div>
                </div>
            `;
        }

        // ==================== LOGIC & EVENT HANDLERS ====================

        function handleLogin(e) {
            e.preventDefault();
            const email = e.target.email.value;
            store.login(email, 'password');
            router.navigate('dashboard');
        }

        function handleRegister(e) {
            e.preventDefault();
            const email = e.target.email.value;
            store.login(email, 'password');
            router.navigate('dashboard');
        }

        function handleDeposit(e) {
            e.preventDefault();
            const amount = parseFloat(e.target.amount.value);
            store.balance += amount;
            store.save();
            alert(`Successfully deposited $${amount.toFixed(2)}`);
            router.navigate('funding');
        }

        function handleWithdraw(e) {
            e.preventDefault();
            const amount = parseFloat(e.target.amount.value);
            if (amount > store.balance) {
                alert('Insufficient funds');
                return;
            }
            store.balance -= amount;
            store.save();
            alert(`Successfully withdrew $${amount.toFixed(2)}`);
            router.navigate('funding');
        }

        let currentOrderSide = 'buy';

        function setOrderSide(side) {
            currentOrderSide = side;
            const btn = document.querySelector('button[onclick="submitOrder()"]');
            if (side === 'buy') {
                btn.textContent = 'Place Buy Order';
                btn.className = 'w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-semibold transition-all hover:scale-[1.02] active:scale-[0.98] mt-4';
            } else {
                btn.textContent = 'Place Sell Order';
                btn.className = 'w-full py-3 bg-red-600 hover:bg-red-700 text-white rounded-lg font-semibold transition-all hover:scale-[1.02] active:scale-[0.98] mt-4';
            }
        }

        function setOrderSize(percent) {
            const size = (store.balance * (percent / 100)).toFixed(2);
            document.getElementById('orderSize').value = size;
            updateEstimatedValue();
        }

        function updateEstimatedValue() {
            const size = parseFloat(document.getElementById('orderSize').value) || 0;
            const fee = size * 0.0002;
            document.getElementById('estimatedValue').textContent = '$' + size.toFixed(2);
            document.getElementById('estimatedFee').textContent = '$' + fee.toFixed(2);
        }

        function submitOrder() {
            const size = parseFloat(document.getElementById('orderSize').value);
            const type = document.getElementById('orderType').value;
            
            if (!size || size <= 0) {
                alert('Please enter a valid size');
                return;
            }

            if (currentOrderSide === 'buy' && size > store.balance) {
                alert('Insufficient balance');
                return;
            }

            const order = store.placeOrder(store.currentSymbol, currentOrderSide, type, size / store.prices[store.currentSymbol]);
            alert(`Order ${order.status}: ${currentOrderSide.toUpperCase()} ${order.quantity} ${store.currentSymbol} @ $${order.price.toFixed(2)}`);
            
            // Refresh UI
            router.navigate('trading');
        }

        // ==================== REAL-TIME UPDATES ====================

        function startPriceUpdates() {
            setInterval(() => {
                const data = store.generatePrice(store.currentSymbol);
                const priceEl = document.getElementById('lastPrice');
                const midPriceEl = document.getElementById('midPrice');
                
                if (priceEl) {
                    priceEl.textContent = '$' + data.price.toLocaleString('en-US', {minimumFractionDigits: 2});
                    priceEl.className = `mono font-semibold text-lg ${data.change >= 0 ? 'text-emerald-400' : 'text-red-400'}`;
                }
                
                if (midPriceEl) {
                    midPriceEl.textContent = '$' + data.price.toLocaleString('en-US', {minimumFractionDigits: 2});
                }

                // Update chart
                if (store.chartInstance) {
                    const dataset = store.chartInstance.data.datasets[0].data;
                    dataset.shift();
                    dataset.push({ x: Date.now(), y: data.price });
                    store.chartInstance.update('none');
                }

            }, 1000);
        }

            container.innerHTML = markets.map(symbol => {

                return `

        function updateOrderBook() {
            const asks = document.getElementById('asks');
            const bids = document.getElementById('bids');
            if (!asks || !bids) return;

            const generateOrders = (type, count) => {
                const base = store.prices[store.currentSymbol] || 67000;
                return Array(count).fill(0).map((_, i) => {
                    const price = type === 'ask' ? base + (i + 1) * 10 : base - (i + 1) * 10;
                    const size = (Math.random() * 2).toFixed(4);
                    const total = (price * size).toFixed(2);
                    const width = Math.random() * 100;
                    
                    return `
                        <div class="order-book-row flex items-center justify-between px-4 py-1 relative cursor-pointer">
                            <div class="absolute ${type === 'ask' ? 'bg-red-500/10' : 'bg-emerald-500/10'} right-0 top-0 bottom-0" style="width: ${width}%"></div>
                            <span class="mono ${type === 'ask' ? 'text-red-400' : 'text-emerald-400'} relative z-10">${price.toFixed(2)}</span>
                            <span class="mono text-slate-400 relative z-10">${size}</span>
                            <span class="mono text-slate-500 relative z-10">${total}</span>
                        </div>
                    `;
                }).join('');
            };

            asks.innerHTML = generateOrders('ask', 8);
            bids.innerHTML = generateOrders('bid', 8);
        }

            const tbody = document.getElementById('recentTrades');

                const price = (store.prices[store.currentSymbol] || 67000) + (Math.random() - 0.5) * 100;
                const size = (Math.random() * 0.5).toFixed(4);
                const isBuy = Math.random() > 0.5;
                const time = new Date(Date.now() - Math.random() * 60000).toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                
                return `
                    <tr class="border-b border-slate-800/30">
                        <td class="py-1.5 px-4 text-slate-500">${time}</td>
                        <td class="py-1.5 px-4 text-right mono ${isBuy ? 'text-emerald-400' : 'text-red-400'}">${price.toFixed(2)}</td>
                        <td class="py-1.5 px-4 text-right mono text-white">${size}</td>
                    </tr>
                `;
            }).join('');
            
            tbody.innerHTML = trades;
        }

        // ==================== START ====================
        
        // Check auth and route
        if (store.user) {
            router.navigate('dashboard');
        } else {
            router.navigate('landing');
        }

    </script>
</body>
</html>
